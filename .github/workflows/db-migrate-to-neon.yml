name: db-migrate-to-neon

# One-off migration: Render free Postgres -> Neon. Manual trigger only.
on:
  workflow_dispatch:

jobs:
  migrate:
    runs-on: ubuntu-24.04
    steps:
      - name: Install PostgreSQL 18 client
        run: |
          sudo sh -c 'echo "deb http://apt.postgresql.org/pub/repos/apt noble-pgdg main" > /etc/apt/sources.list.d/pgdg.list'
          curl -fsSL https://www.postgresql.org/media/keys/ACCC4CF8.asc | sudo gpg --dearmor -o /etc/apt/trusted.gpg.d/postgresql.gpg
          sudo apt-get update -qq && sudo apt-get install -y -qq postgresql-client-18

      - name: Dump from Render
        env:
          OLD_URL: ${{ secrets.OLD_DATABASE_URL_RENDER }}
        run: |
          /usr/lib/postgresql/18/bin/pg_dump -Fc -f /tmp/suki.dump "${OLD_URL}?sslmode=require"
          ls -la /tmp/suki.dump

      - name: Reset Neon schema and restore
        env:
          NEW_URL: ${{ secrets.NEON_DATABASE_URL }}
        run: |
          PGBIN=/usr/lib/postgresql/18/bin
          $PGBIN/psql -v ON_ERROR_STOP=1 -c 'DROP SCHEMA public CASCADE; CREATE SCHEMA public; GRANT ALL ON SCHEMA public TO neondb_owner; GRANT ALL ON SCHEMA public TO public;' "$NEW_URL"
          $PGBIN/pg_restore --no-owner --no-privileges -d "$NEW_URL" /tmp/suki.dump

      - name: Row counts after restore
        env:
          NEW_URL: ${{ secrets.NEON_DATABASE_URL }}
        run: |
          PGBIN=/usr/lib/postgresql/18/bin
          for t in core_user core_helprequest core_message core_notification core_storedfile django_migrations socialaccount_socialaccount account_emailaddress; do
            echo -n "$t: "
            $PGBIN/psql -t -A -c "select count(*) from $t" "$NEW_URL"
          done
