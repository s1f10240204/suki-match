{% if photo_url %}<span class="avatar avatar-{{ size }}{% if mosaic %} is-mosaic{% endif %}"><img src="{{ photo_url }}" alt="{{ u.username }}さんの顔写真{% if mosaic %}(マッチング成立後に表示されます){% endif %}" loading="lazy">{% if mosaic and size != 'xs' and size != 'sm' %}<span class="mosaic-badge" aria-hidden="true"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2"><rect x="5" y="11" width="14" height="10" rx="2"/><path d="M8 11V8a4 4 0 0 1 8 0v3"/></svg></span>{% endif %}</span>{% else %}<span class="avatar avatar-{{ size }} avatar-initial" aria-hidden="true">{{ u.username|first|upper }}</span>{% endif %}
