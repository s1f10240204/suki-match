{% load static %}
<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}Suki-match{% endblock %}</title>
    <link rel="stylesheet" href="{% static 'core/style.css' %}">
</head>
<body>
    <header class="header">
        <div class="header-container">
            <a href="{% url 'core:help_request_list' %}" class="logo">Suki-match</a>
            <div class="desktop-nav">
                <a href="{% url 'core:help_request_list' %}" class="nav-item">
                    <span>ホーム</span>
                </a>
            </div>
        </div>
    </header>

    <main class="main-container">
        {% block content %}
        {% endblock %}
    </main>

    <nav class="mobile-nav">
        <a href="{% url 'core:help_request_list' %}" class="mobile-nav-item">
            <svg fill="currentColor" viewBox="0 0 20 20"><path d="M10.707 2.293a1 1 0 00-1.414 0l-7 7a1 1 0 001.414 1.414L4 10.414V17a1 1 0 001 1h2a1 1 0 001-1v-2a1 1 0 011-1h2a1 1 0 011 1v2a1 1 0 001 1h2a1 1 0 001-1v-6.586l.293.293a1 1 0 001.414-1.414l-7-7z"></path></svg>
            <span>ホーム</span>
        </a>
    </nav>
</body>
</html>
