{% extends 'core/base.html' %}

{% block title %}依頼する - Suki-match{% endblock %}

{% block content %}
<div class="card card-form">
    <h1 class="card-title detail-title">15分のお手伝いを依頼する</h1>
    <form method="post" class="form">
        {% csrf_token %}
        {{ form.as_p }}
        <button type="button" class="btn-secondary" data-geo-fill="id_latitude,id_longitude">現在地を取得</button>
        <button type="submit" class="btn-primary w-full">投稿して近くの人に知らせる</button>
    </form>
</div>
{% endblock %}
