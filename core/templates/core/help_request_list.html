{% extends 'core/base.html' %}

{% block content %}
<div>
    {% for request in help_requests %}
        <a href="{% url 'core:help_request_detail' request.pk %}" class="card">
            <div class="card-header">
                <div class="avatar"></div>
                <div>
                    <p class="username">{{ request.requester.username }}</p>
                    <p class="date">{{ request.created_at|date:"Y/m/d H:i" }}</p>
                </div>
            </div>
            <h2 class="card-title">{{ request.title }}</h2>
            <p class="card-desc">{{ request.description }}</p>
            <div>
                <span class="reward-badge">ステータス: {{ request.status }}</span>
            </div>
        </a>
    {% empty %}
        <div class="empty-state">
            現在、募集はありません。
        </div>
    {% endfor %}
</div>
{% endblock %}
