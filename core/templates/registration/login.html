{% extends 'core/base.html' %}

{% block title %}ログイン - Suki-match{% endblock %}

{% block content %}
<div class="card card-form">
    <h1 class="card-title detail-title">ログイン</h1>
    <form method="post" class="form">
        {% csrf_token %}
        {{ form.as_p }}
        <input type="hidden" name="next" value="{{ next }}">
        <button type="submit" class="btn-primary w-full">ログイン</button>
    </form>
    <p class="date"><a href="{% url 'signup' %}" class="link">アカウントを作成する</a></p>
</div>
{% endblock %}
