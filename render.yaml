# Render の Blueprint(このファイルを読み込むと、Webサービスとデータベースが自動で作られる)
# 手順は README の「Render で公開する」を参照
services:
  - type: web
    name: suki-match
    runtime: python
    plan: free
    region: singapore          # 日本から近いリージョン
    buildCommand: bash build.sh
    startCommand: daphne -b 0.0.0.0 -p $PORT config.asgi:application
    healthCheckPath: /healthz/
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.10
      - key: DJANGO_DEBUG
        value: "0"
      - key: DJANGO_SECRET_KEY
        generateValue: true
      - key: DATABASE_URL
        sync: false
      - key: MEDIA_IN_DATABASE     # 顔写真をDBに保存(無料プランはディスクが消えるため)
        value: "1"
      - key: TASKS_TOKEN           # GitHub Actions から定期処理を呼ぶときの合言葉
        generateValue: true
      # ↓ sync: false の値は、Blueprint 作成時にダッシュボードで入力する
      - key: BREVO_API_KEY
        sync: false
      - key: DEFAULT_FROM_EMAIL    # 例: suki-match <noreply.skimatch@gmail.com>(Brevoで認証した送信元)
        sync: false
      - key: DJANGO_SUPERUSER_USERNAME
        sync: false
      - key: DJANGO_SUPERUSER_EMAIL
        sync: false
      - key: DJANGO_SUPERUSER_PASSWORD
        sync: false
      - key: GOOGLE_CLIENT_ID
        sync: false
      - key: GOOGLE_CLIENT_SECRET
        sync: false
      - key: GOOGLE_MAPS_API_KEY
        sync: false
      - key: PHOTO_REVIEW_TOKEN   # 顔写真の自動審査API用トークン
        sync: false

databases:
  - name: suki-match-db
    plan: free                 # 無料のDBは作成から30日で期限切れ(README参照)
    region: singapore
