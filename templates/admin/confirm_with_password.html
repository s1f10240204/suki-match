{% extends "admin/base_site.html" %}

{% block content %}
<div class="confirm-danger">
    <p class="confirm-warning">{{ warning }}</p>
    <p class="confirm-target-label">対象（{{ objects|length }}件）</p>
    <ul class="confirm-targets">
        {% for obj in objects %}<li>{{ obj }}</li>{% endfor %}
    </ul>
    <form method="post" class="confirm-form">
        {% csrf_token %}
        {% for obj in objects %}<input type="hidden" name="_selected_action" value="{{ obj.pk }}">{% endfor %}
        <input type="hidden" name="action" value="{{ action_name }}">
        <input type="hidden" name="confirm_execute" value="1">
        <label class="confirm-label" for="id_confirm_password">実行するには、あなたの管理者パスワードをもう一度入力してください</label>
        <input class="confirm-input" type="password" name="confirm_password" id="id_confirm_password" autocomplete="current-password" required>
        <div class="confirm-buttons">
            <button type="submit" class="confirm-danger-btn">パスワードを確認して実行する</button>
            <a class="button confirm-cancel" href="{{ changelist_url }}">キャンセル</a>
        </div>
    </form>
</div>
{% endblock %}
